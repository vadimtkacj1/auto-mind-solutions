name: CI/CD Pipeline - Optimized

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and Test
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}
          NODE_ENV: production

      - name: Cache build output
        uses: actions/cache@v3
        with:
          path: .next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

  # Build Docker Image with caching
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: auto-mind-solutions:latest
          build-args: |
            VITE_BASE_URL=${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1
          compression-level: 6

  # Deploy to Server (Optimized)
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./artifact

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "✅ SSH connection successful!"
            echo "Server: $(hostname)"
            echo "User: $(whoami)"
            echo "Date: $(date)"

      - name: Copy Docker image and essential files to server via SSH
        id: scp_copy
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.yml,.env.docker.example,artifact/image.tar"
          target: "/opt/auto-mind-solutions"
          rm: false
          strip_components: 0
          overwrite: true
          timeout: 30s
          command_timeout: 10m
          debug: true
          use_insecure_cipher: false

      - name: Alternative file copy via SSH (if SCP fails)
        if: steps.scp_copy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "📦 Using alternative SSH copy method..."
            mkdir -p /opt/auto-mind-solutions/artifact

      - name: Copy files using rsync (alternative method)
        if: steps.scp_copy.outcome == 'failure'
        env:
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_HOST: ${{ secrets.IP_SERVER }}
          SERVER_USER: ${{ secrets.USER_SERVER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Using rsync as alternative..."

          # Set port with default value
          SSH_PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Copy files using rsync
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${SSH_PORT}" \
            docker-compose.yml .env.docker.example artifact/image.tar \
            ${SERVER_USER}@${SERVER_HOST}:/opt/auto-mind-solutions/

          rm ~/.ssh/deploy_key

      - name: Deploy to server via SSH (Fast deployment)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            
            # Navigate to deployment directory
            cd /opt/auto-mind-solutions
            
            echo "🚀 Starting optimized deployment..."

            # Create .env file from secrets
            cat > .env <<'EOF'
            # Email Configuration
            EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}
            EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}
            EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}
            EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}
            EMAIL_TO=${{ secrets.EMAIL_TO }}

            # Next.js Configuration
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}
            NODE_ENV=production
            PORT=80
            HOSTNAME=0.0.0.0
            NEXT_TELEMETRY_DISABLED=1
            EOF

            # Stop old containers FIRST (before loading new image)
            echo "🛑 Stopping old containers..."
            docker compose down --remove-orphans || true
            
            # Also stop any standalone containers using port 80
            if docker ps -q -f name=my-front | grep -q .; then
              echo "📦 Stopping old standalone container..."
              docker stop my-front 2>/dev/null || true
              docker rm my-front 2>/dev/null || true
            fi
            
            # Check if port 80 is still occupied
            if lsof -Pi :80 -sTCP:LISTEN -t >/dev/null 2>&1; then
              echo "⚠️ Port 80 is still occupied, attempting to free it..."
              lsof -Pi :80 -sTCP:LISTEN || true
              # Force kill any process on port 80
              fuser -k 80/tcp 2>/dev/null || true
              sleep 2
            fi

            # Load Docker image from artifact
            echo "📦 Loading Docker image from artifact..."
            if [ -f artifact/image.tar ]; then
              docker load -i artifact/image.tar
              echo "✅ Docker image loaded successfully"
            else
              echo "❌ Docker image artifact not found!"
              ls -la artifact/ || echo "artifact directory not found"
              exit 1
            fi

            # Start containers using docker-compose
            echo "🚀 Starting containers with docker-compose..."
            docker compose up -d

            # Wait for container to be healthy
            echo "⏳ Waiting for container to be healthy..."
            timeout 60s bash -c 'until docker inspect --format="{{.State.Health.Status}}" auto-mind-solutions-web | grep -q healthy; do sleep 2; done' || \
              (echo "❌ Container health check failed" && docker compose logs && exit 1)

            # Clean up
            echo "🧹 Cleaning up..."
            rm -rf artifact/
            docker image prune -f --filter "until=24h"

            # Show status
            echo "✅ Deployment successful!"
            docker compose ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/auto-mind-solutions
            # Check if container is running
            if docker compose ps | grep -q "auto-mind-solutions-web"; then
              echo "✅ Deployment successful! Container is running."
              docker compose logs --tail 50
            else
              echo "❌ Deployment failed! Container is not running."
              docker compose ps
              docker compose logs
              exit 1
            fi

  # Notify on Success/Failure
  notify:
    needs: [build, docker, deploy]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Docker image: auto-mind-solutions:latest"
          echo "🌐 Application is now live!"

      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs for details."
          echo "🔍 Review the workflow logs to identify the issue."