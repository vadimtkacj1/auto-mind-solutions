# GitHub Actions workflow for deploying a Dockerized application to a remote server.
#
# Required Secrets in Settings > Secrets and variables > Actions:
# - SSH_PRIVATE_KEY: Private SSH key to access the server
# - USER_SERVER: Username on the server (e.g., ubuntu, root)
# - IP_SERVER: Server's IP address or domain name
# - VITE_BASE_URL: Base API URL (passed as build arg to Docker)

name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (improves build performance and compatibility)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build the Docker image and save it as a compressed file
      # Using gzip significantly reduces the amount of data transferred over SSH
      - name: Build and Save Docker image
        run: |
          docker build --build-arg VITE_BASE_URL="${{ secrets.VITE_BASE_URL }}" -t my-front:${{ github.sha }} .
          docker save my-front:${{ github.sha }} | gzip > image.tar.gz

      # 4. Upload the compressed image to the server
      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "image.tar.gz"
          target: "~/"

      # 5. Connect via SSH to update the running container
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Load the image from the compressed file
            gunzip -c ~/image.tar.gz | docker load
            rm ~/image.tar.gz
            
            # Stop and remove the old container (if exists)
            docker stop my-front || true
            docker rm my-front || true
            
            # Run the new container
            docker run -d \
              --restart always \
              --name my-front \
              -p 80:80 \
              my-front:${{ github.sha }}
            
            # Clean up old/unused images to save disk space
            docker image prune -a -f