name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  # Build and Test
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}

  # Build Docker Image (without pushing to registry)
  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auto-mind-solutions:latest
          build-args: |
            VITE_BASE_URL=${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # Deploy to Server
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "."
          target: "/opt/auto-mind-solutions"
          rm: false
          strip_components: 0

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to deployment directory
            cd /opt/auto-mind-solutions

            # Create .env file from secrets
            cat > .env <<'EOF'
            # Email Configuration
            EMAIL_SERVER_HOST=${{ secrets.EMAIL_SERVER_HOST }}
            EMAIL_SERVER_PORT=${{ secrets.EMAIL_SERVER_PORT }}
            EMAIL_SERVER_USER=${{ secrets.EMAIL_SERVER_USER }}
            EMAIL_SERVER_PASSWORD=${{ secrets.EMAIL_SERVER_PASSWORD }}
            EMAIL_TO=${{ secrets.EMAIL_TO }}

            # Next.js Configuration
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}
            NODE_ENV=production
            EOF

            # Stop and remove old container
            docker stop my-front 2>/dev/null || true
            docker rm my-front 2>/dev/null || true

            # Build Docker image locally from source
            docker build -t auto-mind-solutions:latest \
              --build-arg VITE_BASE_URL="${{ secrets.NEXT_PUBLIC_API_URL || secrets.VITE_BASE_URL }}" \
              .

            # Start new container
            docker run -d \
              --restart always \
              --name my-front \
              -p 80:80 \
              --env-file .env \
              auto-mind-solutions:latest

            # Clean up old images
            docker image prune -f

            # Show status
            docker ps | grep "my-front"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Check if container is running
            if docker ps | grep -q "my-front"; then
              echo "✅ Deployment successful! Container is running."
              docker logs --tail 50 my-front
            else
              echo "❌ Deployment failed! Container is not running."
              exit 1
            fi

  # Notify on Success/Failure
  notify:
    needs: [build, docker, deploy]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Docker image: auto-mind-solutions:latest"
          echo "🌐 Application is now live!"

      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs for details."
          echo "🔍 Review the workflow logs to identify the issue."